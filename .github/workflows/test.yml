name: Validate public repository

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run deterministic validation
        run: python -m unittest discover -s tests -v

      - name: Validate JSON manifests and examples
        run: |
          python -m json.tool config/workflow.example.json > /dev/null
          python -m json.tool examples/candidate-profile.example.json > /dev/null
          python -m json.tool examples/status-summary.example.json > /dev/null
